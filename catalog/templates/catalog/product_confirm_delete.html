{% extends 'catalog/base.html' %}

{% block title %}Удалить продукт{% endblock %}

{% block content %}
<!--{% include 'catalog/header.html' %}-->

<div class="container">
  <div class="row">
    <div class="col-6">
      <h2>Удалить продукта</h2>
      <p>Вы уверены, что хотите удалить "{{ object.product_name }}"?</p>
      <form class="row" method="post" enctype="multipart/form-data">
        <div class="card">
          <div class="card-body">
            {% csrf_token %}
          </div>
          <button type="submit" class="btn btn-primary">
            Удалить
          </button>
          <a href="{% url 'catalog:product_list' %}" class="btn btn-secondary">Отмена</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
