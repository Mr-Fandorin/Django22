{% extends 'catalog/base.html' %}

{% block title %}Форма продукта{% endblock %}

{% block content %}
<!--{% include 'catalog/header.html' %}-->

<div class="container">
  <div class="row">
    <div class="col-6">
      <h2>Форма продукта</h2>
      <form class="row" method="post" enctype="multipart/form-data">
        <div class="card">
          <div class="card-body">
            {% csrf_token %}
            {{ form.as_p }}
          </div>
          <button type="submit" class="btn btn-primary">
            {% if object %}
            Сохранить
            {% else %}
            Добавить продукт
            {% endif %}
          </button>
          <a href="{% url 'catalog:product_list' %}" class="btn btn-secondary">Отмена</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
