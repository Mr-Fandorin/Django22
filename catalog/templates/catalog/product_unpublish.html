{% extends 'catalog/base.html' %}

{% block title %}Отменить публикацию продукта{% endblock %}

{% block content %}
<div class="container">
  <div class="row">
    <div class="col-6">
      <h2>Отменить публикацию продукта</h2>
      <p>Вы уверены, что хотите снять с публикации продукт "{{ object.product_name }}"?</p>
      <form method="post">
        {% csrf_token %}
        <input type="hidden" name="status" value="unpublished">
        <button type="submit" class="btn btn-warning">Снять с публикации</button>
        <a href="{% url 'catalog:product_detail' object.pk %}" class="btn btn-secondary">Отмена</a>
      </form>
    </div>
  </div>
</div>
{% endblock %}
